version: "3.9"

services:
  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aerosovereign-backend
    env_file:
      - ../backend/.env
    environment:
      - MODEL_HOST=http://model-runner.docker.internal/engines/v1
      - POSTGRES_HOST=postgres
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

  # ── Local PostgreSQL (replaces Supabase — sovereignty requirement) ──────────
  postgres:
    image: postgres:16
    container_name: aerosovereign-postgres
    environment:
      POSTGRES_USER: aerosovereign
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: aerosovereign
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Qdrant (vector DB for Week 5 RAG embeddings) ─────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aerosovereign-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  # ── (Optional) Frontend ──────────────────────────────────────────────────────
  # Uncomment to containerise the Vite dev server:
  # frontend:
  #   image: node:20-alpine
  #   working_dir: /app
  #   volumes:
  #     - ../frontend:/app
  #   command: sh -c "npm install && npm run dev -- --host"
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     - VITE_API_URL=http://localhost:8000/api/v1

volumes:
  pgdata:
  qdrantdata: